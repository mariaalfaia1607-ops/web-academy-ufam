<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeria de fotos favoritas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Work+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="pagina">
      <header class="cabecalho">
        <h1>Galeria de fotos favoritas</h1>
        <p class="legenda">Clique em uma miniatura para ver de perto</p>
      </header>

      <div class="full-img">
        <img
          class="displayed-img"
          src="images/pic1.jpg"
          alt="Dupla jogando vôlei de praia ao pôr do sol"
        />
        <div class="overlay"></div>
        <button class="dark">Darken</button>
      </div>

      <div class="thumb-bar"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
